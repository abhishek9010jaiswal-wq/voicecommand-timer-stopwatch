      (function() {
        var isDev = (function(){ try { return import.meta && import.meta.env && import.meta.env.DEV; } catch(e){ return false; }})();
        if (!isDev) return;
        var isViteHmrLog = function(args) {
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            if (arg) {
              var str = String(arg.message || (arg.stack ? arg.stack : arg));
              if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1 || str.indexOf('vite-hmr') !== -1 || str.indexOf('failed to connect to websocket') !== -1 || str.indexOf('[vite] connecting') !== -1) return true;
            }
          }
          return false;
        };
        ['error','warn','info','debug','log'].forEach(function(method){
          var orig=console[method]; if(!orig) return;
          console[method]=function(){ if(isViteHmrLog(arguments)) return; orig.apply(console,arguments); };
        });
        window.addEventListener('error', function(e){
          var msg=String(e.message||(e.error&&e.error.message)||'');
          if(msg.indexOf('WebSocket')!==-1||msg.indexOf('closed without opened')!==-1||(e.filename&&e.filename.indexOf('@vite/client')!==-1)){ e.stopImmediatePropagation(); e.preventDefault(); return false; }
        }, true);
        window.addEventListener('unhandledrejection', function(e){
          var reasonMsg=String((e.reason&&(e.reason.message||e.reason.stack||e.reason))||'');
          if(reasonMsg.indexOf('WebSocket')!==-1||reasonMsg.indexOf('closed without opened')!==-1||reasonMsg.indexOf('vite-hmr')!==-1){ e.stopImmediatePropagation(); e.preventDefault(); return false; }
        }, true);
      })();
    </script>
